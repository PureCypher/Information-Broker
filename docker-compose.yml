services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: information-broker-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-information_broker}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-information_broker}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Main RSS Monitor Application
  rss-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: information-broker-app
    depends_on:
      postgres:
        condition: service_healthy
      flaresolverr:
        condition: service_started
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-information_broker}
      
      # Application Configuration
      APP_PORT: ${APP_PORT:-8080}
      RSS_FETCH_INTERVAL: ${RSS_FETCH_INTERVAL:-5m}
      RSS_FEEDS_FILE: ${RSS_FEEDS_FILE:-/app/feeds.txt}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
      # API Configuration
      API_TIMEOUT: ${API_TIMEOUT:-30s}
      API_USER_AGENT: ${API_USER_AGENT:-Information-Broker/1.0}

      # FlareSolverr (Cloudflare challenge solver) Configuration
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-http://flaresolverr:8191/v1}
      FLARESOLVERR_TIMEOUT: ${FLARESOLVERR_TIMEOUT:-60s}
      
      # llama.cpp Configuration (summarizer on the GPU, embeddings on the CPU)
      LLAMA_URL: ${LLAMA_URL:-http://llama-granite:8080}
      LLAMA_EMBED_URL: ${LLAMA_EMBED_URL:-http://llama-embed:8081}
      LLAMA_MODEL: ${LLAMA_MODEL:-granite-4.2-3b}
      LLAMA_TIMEOUT: ${LLAMA_TIMEOUT:-60s}
      LLAMA_MAX_RETRIES: ${LLAMA_MAX_RETRIES:-3}
      LLAMA_MAX_TOKENS: ${LLAMA_MAX_TOKENS:-512}
      
      # Summarization queue capacity. A burst larger than this (e.g. onboarding a big
      # feed) overflows into 'summary unavailable' placeholders, so raise it first.
      SUMMARIZATION_MAX_QUEUE_SIZE: ${SUMMARIZATION_MAX_QUEUE_SIZE:-100}

      # Discord Configuration
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_WEBHOOK_URLS: ${DISCORD_WEBHOOK_URLS:-}
      # Comma-separated feed-URL substrings to suppress from Discord (still stored/summarized).
      DISCORD_EXCLUDED_FEEDS: ${DISCORD_EXCLUDED_FEEDS:-cvefeed.io,exploit-db.com}
      # Temporary, for onboarding new feeds without flooding Discord: articles from feeds
      # matching DISCORD_SILENT_FEEDS (comma-separated URL substrings) that are ingested before
      # DISCORD_SILENT_UNTIL (RFC3339, e.g. 2026-10-29T12:00:00Z) are stored as already posted.
      # A malformed DISCORD_SILENT_UNTIL stops startup rather than silently disabling this.
      DISCORD_SILENT_FEEDS: ${DISCORD_SILENT_FEEDS:-}
      DISCORD_SILENT_UNTIL: ${DISCORD_SILENT_UNTIL:-}
      DISCORD_MAX_RETRIES: ${DISCORD_MAX_RETRIES:-2}
      DISCORD_TIMEOUT: ${DISCORD_TIMEOUT:-30s}
      
      # Prometheus Configuration
      PROMETHEUS_METRICS_PATH: ${PROMETHEUS_METRICS_PATH:-/metrics}
      
      # Security Configuration
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,DELETE,OPTIONS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Content-Type,Authorization}
      
      # Performance Configuration
      MAX_CONCURRENT_FEEDS: ${MAX_CONCURRENT_FEEDS:-10}
      MAX_ARTICLE_CONTENT_LENGTH: ${MAX_ARTICLE_CONTENT_LENGTH:-10000}
      MAX_ARTICLE_HTML_LENGTH: ${MAX_ARTICLE_HTML_LENGTH:-65536}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-15s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      
      # Content Configuration
      MAX_SUMMARY_LENGTH: ${MAX_SUMMARY_LENGTH:-200}
      CONTENT_HASH_ALGORITHM: ${CONTENT_HASH_ALGORITHM:-sha256}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./feeds.txt:/app/feeds.txt:ro  # <- MOUNT THE FILE HERE
    healthcheck:
      # The runtime image is built FROM scratch (no shell/wget/curl), so the
      # binary probes its own /health endpoint via the -health-check flag.
      test: ["CMD", "/app/information-broker", "-health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - app-network
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8080"
      - "prometheus.path=/metrics"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # FlareSolverr - headless-browser proxy that solves Cloudflare/WAF challenges
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: information-broker-flaresolverr
    environment:
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v3.5.5
    container_name: information-broker-prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}'
      - '--log.level=${PROMETHEUS_LOG_LEVEL:-info}'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # llama.cpp: summarizer on the Vega 64 (Vulkan/RADV). All layers on the GPU.
  # Tuned with llama-bench: flash attention on, f16 KV cache (quantised KV was slower),
  # -ub 1024 (prompt processing plateaus there). Two slots let the scheduler overlap requests.
  llama-granite:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: information-broker-llama-granite
    command:
      - --model
      - "/models/${LLAMA_MODEL_FILE:-granite-4.2-3b-Q4_K_M.gguf}"
      - --alias
      - "${LLAMA_MODEL:-granite-4.2-3b}"
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --n-gpu-layers
      - "99"
      - --flash-attn
      - "on"
      - --ctx-size
      - "${LLAMA_CTX_SIZE:-16384}"
      - --parallel
      - "${LLAMA_PARALLEL:-2}"
      - --batch-size
      - "2048"
      - --ubatch-size
      - "1024"
      - --jinja
      - --chat-template-kwargs
      - '{"enable_thinking":false}'
      - --metrics
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-993}"
      - "${VIDEO_GID:-44}"
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # llama.cpp: embeddings on the CPU for story clustering (runs every 15 min, so no GPU needed).
  llama-embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: information-broker-llama-embed
    command:
      - --model
      - "/models/${LLAMA_EMBED_MODEL_FILE:-nomic-embed-text-v1.5.f16.gguf}"
      - --host
      - "0.0.0.0"
      - --port
      - "8081"
      - --embeddings
      - --pooling
      - "mean"
      - --ctx-size
      - "4096"
      - --batch-size
      - "2048"
      - --ubatch-size
      - "2048"
      - --threads
      - "${LLAMA_EMBED_THREADS:-8}"
      - --n-gpu-layers
      - "0"
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Alerting Service
  alertmanager:
    build:
      context: ./alerting
      dockerfile: Dockerfile
    container_name: information-broker-alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      CONFIG_FILE: /root/config.yaml
    volumes:
      - ./alerting/config.yaml:/root/config.yaml:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

networks:
  app-network:
    driver: bridge
    name: information-broker-network

volumes:
  postgres_data:
    name: information-broker-postgres-data
  prometheus_data:
    name: information-broker-prometheus-data
